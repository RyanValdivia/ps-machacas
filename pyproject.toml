[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "registrame.settings_test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
pythonpath = "backend"

[tool.coverage.run]
source = ["backend"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "tests.py",
    "manage.py",
    "*/wsgi.py",
    "*/asgi.py",
    "*/apps.py",
    "*/admin.py",
    "*/__init__.py",
    "backend/_check_db.py",
    "backend/run_server.py",
    "backend/products/seed_products.py"
]

[tool.coverage.report]
show_missing = true
skip_empty = true
