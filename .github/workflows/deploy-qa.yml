name: Build and deploy QA

on:
  push:
    branches:
      - qa
  pull_request:
    branches:
      - qa
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: qa

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -r ../infra/shared/docker/backend/requirements.txt

      - name: Run tests with coverage
        run: python -m pytest --cov=. --cov-report=term-missing
        env:
          DJANGO_SETTINGS_MODULE: registrame.settings_test
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: 5432

      - name: Run integration tests
        run: python -m pytest -m integration
        env:
          DJANGO_SETTINGS_MODULE: registrame.settings_test
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: 5432

      - name: Run security tests
        run: python -m pytest tests/security -v
        env:
          DJANGO_SETTINGS_MODULE: registrame.settings_test
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: 5432
  e2e:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install -r infra/shared/docker/backend/requirements.txt

      - name: Apply migrations and seed database
        run: |
          python backend/manage.py migrate
          PGPASSWORD=test psql -h localhost -U test -d test_db -f database_seed.sql
        env:
          DJANGO_SETTINGS_MODULE: registrame.settings_test
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: 5432

      - name: Start Django Backend server
        run: |
          python backend/manage.py runserver 8000 &
        env:
          DJANGO_SETTINGS_MODULE: registrame.settings_test
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: 5432

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: frontend

      - name: Start Frontend server & run E2E tests
        run: npx playwright test
        working-directory: frontend
        env:
          CI: true
          TEST_USER: gerente1
          TEST_PASSWORD: Admin123!
          TEST_VENDEDOR_USER: vendedor1
          TEST_VENDEDOR_PASS: Admin123!
          TEST_GERENTE_USER: gerente1
          TEST_GERENTE_PASS: Admin123!
          TEST_LOGISTICA_USER: logistica1
          TEST_LOGISTICA_PASS: Admin123!
          TEST_OPTOMETRA_USER: optometra1
          TEST_OPTOMETRA_PASS: Admin123!

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  performance:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install -r infra/shared/docker/backend/requirements.txt

      - name: Apply migrations and seed database
        run: |
          python backend/manage.py migrate
          PGPASSWORD=test psql -h localhost -U test -d test_db -f database_seed.sql
        env:
          DJANGO_SETTINGS_MODULE: registrame.settings_test
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: 5432

      - name: Start Django Backend server
        run: |
          python backend/manage.py runserver 8000 &
          sleep 3
        env:
          DJANGO_SETTINGS_MODULE: registrame.settings_test
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: 5432

      - name: Run Locust load test (100 concurrent logins)
        run: |
          locust -f backend/tests/stress/locustfile_auth.py \
            --host http://localhost:8000 \
            --users 100 --spawn-rate 10 --run-time 1m \
            --headless --csv=locust_report
        env:
          TEST_USERS_JSON: '[{"usuNom":"gerente1","usuContra":"Admin123!"},{"usuNom":"vendedor1","usuContra":"Admin123!"},{"usuNom":"cajero1","usuContra":"Admin123!"},{"usuNom":"optometra1","usuContra":"Admin123!"},{"usuNom":"logistica1","usuContra":"Admin123!"}]'

      - name: Upload Locust report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locust-report
          path: locust_report*
          retention-days: 30

  recoverability:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: registrame.settings_test
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: test_db
      DB_USER: test
      DB_PASSWORD: test
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install -r infra/shared/docker/backend/requirements.txt

      - name: Apply migrations and seed database
        run: |
          python backend/manage.py migrate
          PGPASSWORD=test psql -h localhost -U test -d test_db -f database_seed.sql

      - name: Start Django Backend server
        run: |
          python backend/manage.py runserver 8000 &
          sleep 3

      - name: Start Locust load (10 usuarios, background)
        run: |
          mkdir -p evidence/nf-rec-01
          nohup locust -f backend/tests/stress/locustfile_pos.py \
            --host=http://localhost:8000 \
            --users 10 --spawn-rate 2 --run-time 90s \
            --headless --csv=evidence/nf-rec-01/locust_report \
            > evidence/nf-rec-01/locust_stdout.log 2>&1 &
          echo $! > /tmp/locust.pid
        env:
          TEST_VENDEDOR_USER: vendedor1
          TEST_VENDEDOR_PASS: Admin123!

      - name: Simular caída abrupta de PostgreSQL
        run: |
          sleep 20  # deja que la carga se estabilice antes de cortar la BD
          PG_CID=$(docker ps --filter "ancestor=postgres:16-alpine" --format '{{.ID}}' | head -n1)
          echo "PG_CID=$PG_CID" >> "$GITHUB_ENV"
          echo "Deteniendo contenedor PostgreSQL: $PG_CID"
          docker stop "$PG_CID"

      - name: Reiniciar PostgreSQL tras 30s de caída
        run: |
          sleep 30
          echo "Reiniciando contenedor PostgreSQL: $PG_CID"
          docker start "$PG_CID"
          docker logs "$PG_CID" > evidence/nf-rec-01/postgres_docker.log 2>&1

      - name: Esperar a que finalice la carga Locust
        run: |
          LOCUST_PID=$(cat /tmp/locust.pid)
          while kill -0 "$LOCUST_PID" 2>/dev/null; do sleep 2; done

      - name: Verificar que el sistema responde tras el reinicio (HTTP 200)
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o evidence/nf-rec-01/login_after_restart.json -w '%{http_code}' \
              -X POST http://localhost:8000/api/user/token/ \
              -H "Content-Type: application/json" \
              -d '{"usuNom": "vendedor1", "usuContra": "Admin123!"}')
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then break; fi
            sleep 2
          done
          test "$STATUS" = "200"

      - name: Verificar integridad transaccional (stock y estados de venta)
        run: |
          PGPASSWORD=test psql -h localhost -U test -d test_db \
            -f backend/tests/reliability/verify_nf_rec_01.sql \
            | tee evidence/nf-rec-01/verify_nf_rec_01_output.txt

          NEGATIVE_STOCK=$(PGPASSWORD=test psql -h localhost -U test -d test_db -t -A -c \
            "SELECT count(*) FROM product WHERE \"prodStock\" < 0;")
          echo "Productos con stock negativo: $NEGATIVE_STOCK"
          test "$NEGATIVE_STOCK" = "0"

      - name: Upload NF-REC-01 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf-rec-01-evidence
          path: evidence/nf-rec-01/
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize GHCR owner
        id: normalize
        shell: bash
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/shared/docker/backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/registrame-backend:${{ env.IMAGE_TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/shared/docker/frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/registrame-frontend:${{ env.IMAGE_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -e
            cd "${{ secrets.VPS_QA_APP_DIR }}"
            git fetch --all
            git checkout qa
            git pull
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose --env-file infra/qa/.env -f infra/qa/compose.yml pull
            docker compose --env-file infra/qa/.env -f infra/qa/compose.yml up -d --remove-orphans --force-recreate
            docker image prune -f
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  seed:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seed QA database
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          envs: VPS_QA_APP_DIR
          script: |
            cd "$VPS_QA_APP_DIR"
            echo "Waiting for QA database..."
            for i in $(seq 1 30); do
              docker exec registrame-qa-db pg_isready -U postgres && break
              echo "DB not ready, retrying in 2s..."
              sleep 2
            done
            echo "Running seed..."
            docker exec -i registrame-qa-db psql -U postgres -d registrame_qa_db < database_seed.sql
            echo "Seed complete."
        env:
          VPS_QA_APP_DIR: ${{ secrets.VPS_QA_APP_DIR }}
