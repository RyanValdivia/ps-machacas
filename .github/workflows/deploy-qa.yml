name: Build and deploy QA

on:
  push:
    branches:
      - qa
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: qa

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -r ../infra/shared/docker/backend/requirements.txt

      - name: Run tests with coverage
        run: python -m pytest --cov=. --cov-report=term-missing
        env:
          DJANGO_SETTINGS_MODULE: registrame.settings_test
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_db
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: 5432

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize GHCR owner
        id: normalize
        shell: bash
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/shared/docker/backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/registrame-backend:${{ env.IMAGE_TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/shared/docker/frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/registrame-frontend:${{ env.IMAGE_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -e
            cd "${{ secrets.VPS_QA_APP_DIR }}"
            git fetch --all
            git checkout qa
            git pull
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose --env-file infra/qa/.env -f infra/qa/compose.yml pull
            docker compose --env-file infra/qa/.env -f infra/qa/compose.yml up -d --remove-orphans --force-recreate
            docker image prune -f
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  seed:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seed QA database
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          envs: VPS_QA_APP_DIR
          script: |
            cd "$VPS_QA_APP_DIR"
            echo "Waiting for QA database..."
            for i in $(seq 1 30); do
              docker exec registrame-qa-db pg_isready -U postgres && break
              echo "DB not ready, retrying in 2s..."
              sleep 2
            done
            echo "Running seed..."
            docker exec -i registrame-qa-db psql -U postgres -d registrame_qa_db < database_seed.sql
            echo "Seed complete."
        env:
          VPS_QA_APP_DIR: ${{ secrets.VPS_QA_APP_DIR }}
